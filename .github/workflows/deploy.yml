name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup static site artifact
        run: |
          mkdir -p dist
          # Copy HTML templates to root of dist
          cp templates/*.html dist/
          # Keep templates subfolder for relative path compatibility
          mkdir -p dist/templates
          cp templates/*.html dist/templates/
          # Copy static directories
          cp -r css dist/
          cp -r js dist/
          cp -r image dist/
          cp -r images dist/
          if [ -d "audio" ]; then cp -r audio dist/; fi
          if [ -d "video" ]; then cp -r video dist/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
