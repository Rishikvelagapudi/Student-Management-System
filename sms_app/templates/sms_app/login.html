<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NRIIT SMS</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <img src="/static/images/logo.png" alt="NRIIT Logo">
        <div class="brand-text">
          <span class="brand-title">NRIIT SMS</span>
          <span class="brand-subtitle">Deemed to be University</span>
        </div>
      </a>
      <nav>
        <ul>
          <li><a href="/" class="active">Login</a></li>
          <li><a href="/register">Register</a></li>
          <li><a href="/courses">Courses</a></li>
          <li><a href="/trainers">Trainers</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="/register" class="btn btn-primary btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <img src="/static/images/logo.png" alt="NRIIT Logo" class="auth-logo">
        <h2 class="page-title" style="font-size: 1.75rem;">Welcome Back</h2>
        <p class="page-subtitle" style="font-size: 0.9rem;">Sign in with your registered email and password to enter.</p>
      </div>

      <!-- Inline Alert Box for Login Feedback -->
      <div id="login-alert" class="glass-panel" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.88rem; border-radius: 8px;"></div>

      <form id="loginForm" onsubmit="submitLogin(event); return false;">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="e.g. rishikvelagapudi@gmail.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="button" onclick="submitLogin(event)" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Sign In →</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.88rem;">
        New student? <a href="/register" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Register account here</a>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="/static/js/script.js"></script>
</body>
</html>
