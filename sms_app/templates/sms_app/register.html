<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NRIIT SMS</title>
  <!-- Bootstrap 5 CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">

  <!-- Bootstrap Navigation Header -->
  <nav class="navbar navbar-expand-lg sticky-top custom-navbar bg-white border-bottom shadow-sm">
    <div class="container">
      <a href="/" class="navbar-brand d-flex align-items-center gap-2">
        <img src="/static/images/logo.png" alt="NRIIT Logo" style="height: 40px;">
        <div class="brand-text">
          <span class="brand-title d-block fw-bold" style="color: var(--primary);">NRIIT SMS</span>
          <span class="brand-subtitle d-block text-muted" style="font-size: 0.75rem;">Deemed to be University</span>
        </div>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fw-semibold">
          <li class="nav-item"><a class="nav-link" href="/login">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="/register">Register</a></li>
          <li class="nav-item"><a class="nav-link" href="/courses">Courses</a></li>
          <li class="nav-item"><a class="nav-link" href="/trainers">Trainers</a></li>
        </ul>
        <div class="nav-actions d-flex gap-2">
          <a href="/login" class="btn btn-outline-primary btn-sm">Login</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card border-0 shadow-lg rounded-4 p-4">
          <div class="text-center mb-4">
            <img src="/static/images/logo.png" alt="NRIIT Logo" class="mb-3" style="max-height: 70px;">
            <h2 class="h4 fw-bold text-dark mb-1">Create Account</h2>
            <p class="text-muted small">Join NRIIT SMS to start learning today.</p>
          </div>

          <!-- Inline Alert Box for Registration Feedback -->
          <div id="register-alert" class="alert alert-info py-2 px-3 small" style="display: none;"></div>

          <form id="registerForm" onsubmit="submitRegister(event); return false;">
            <div class="mb-3">
              <label for="regName" class="form-label fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                <input type="text" id="regName" class="form-control" placeholder="Your Full Name" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="regEmail" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" id="regEmail" class="form-control" placeholder="your.email@nriit.edu" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="regPassword" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" id="regPassword" class="form-control" placeholder="Create a password" required>
              </div>
            </div>
            <div class="mb-3">
              <label for="regCourse" class="form-label fw-semibold">Select Preferred Course</label>
              <select id="regCourse" class="form-select">
                <option value="Python FullStack Development">Python FullStack Development</option>
                <option value="Java FullStack Development">Java FullStack Development</option>
                <option value="Data Science & AI">Data Science & AI</option>
              </select>
            </div>
            <div class="row g-2 mb-4">
              <div class="col-6">
                <label for="regDob" class="form-label fw-semibold">Date of Birth</label>
                <input type="date" id="regDob" class="form-control">
              </div>
              <div class="col-6">
                <label for="regGender" class="form-label fw-semibold">Gender</label>
                <select id="regGender" class="form-select">
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>
            <button type="button" onclick="submitRegister(event)" class="btn btn-primary w-100 btn-lg shadow-sm">
              Create Account <i class="bi bi-person-plus"></i>
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top text-muted small">
            Already registered? <a href="/login" class="fw-semibold text-decoration-none">Login here</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/script.js"></script>
</body>
</html>
