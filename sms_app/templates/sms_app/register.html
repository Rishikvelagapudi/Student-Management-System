<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - NRIIT SMS</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <div class="nav-container">
      <a href="/" class="brand-logo">
        <img src="/static/images/logo.png" alt="NRIIT Logo">
        <div class="brand-text">
          <span class="brand-title">NRIIT SMS</span>
          <span class="brand-subtitle">Deemed to be University</span>
        </div>
      </a>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/students">Students</a></li>
          <li><a href="/courses">Courses</a></li>
          <li><a href="/trainers">Trainers</a></li>
        </ul>
      </nav>
      <div class="nav-actions">
        <a href="/login" class="btn btn-secondary btn-sm">Login</a>
      </div>
    </div>
  </header>

  <main class="auth-wrapper">
    <div class="auth-card" style="max-width: 500px;">
      <div class="auth-header">
        <img src="/static/images/logo.png" alt="NRIIT Logo" class="auth-logo">
        <h2 class="page-title" style="font-size: 1.75rem;">Create Account</h2>
        <p class="page-subtitle" style="font-size: 0.9rem;">Join NRIIT SMS to start learning today.</p>
      </div>

      <!-- Inline Alert Box for Registration Feedback -->
      <div id="register-alert" class="glass-panel" style="display: none; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.88rem; border-radius: 8px;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="regName" class="form-input" placeholder="Your Full Name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="regEmail" class="form-input" placeholder="your.email@nriit.edu" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPassword" class="form-input" placeholder="Create a password" required>
        </div>
        <div class="form-group">
          <label class="form-label">Select Preferred Course</label>
          <select id="regCourse" class="form-select">
            <option value="Python FullStack Development">Python FullStack Development</option>
            <option value="Java FullStack Development">Java FullStack Development</option>
            <option value="Data Science & AI">Data Science & AI</option>
          </select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date" id="regDob" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Gender</label>
            <select id="regGender" class="form-select">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account →</button>
      </form>

      <div style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.88rem;">
        Already registered? <a href="/login" style="color: var(--accent-cyan); font-weight: 600; text-decoration: none;">Login here</a>
      </div>
    </div>
  </main>

  <div id="toast-container"></div>
  <script src="/static/js/script.js"></script>
</body>
</html>
