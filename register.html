<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/static/style.css">
    <title>Register page</title>
</head>

<body>
    <header>Register</header>
    <main>
        <div style="margin-bottom: 1rem;">
            <a href="index.html" class="back-btn">&larr; Back to Home</a>
        </div>
        <h2>Student Registration </h2>
        <form id="registerForm" onsubmit="return handleRegister(event)">
            <label>Full Name</label><br>
            <input type="text" id="regName" placeholder="Enter Your Name" required><br>
            <label>Email</label><br>
            <input type="email" id="regEmail" placeholder="Enter your email" required><br>
            <label>Password</label><br>
            <input type="password" id="regPassword" placeholder="Enter Your Password" required><br>
            <label>Date of Birth</label><br>
            <input type="date" id="regDob" placeholder="DOB"><br>
            <label>Gender</label><br>
            <input type="radio" name="gender" value="Male" checked>Male
            <input type="radio" name="gender" value="Female">Female <br><br>
            <label>Select Course</label>
            <br>
            <select id="regCourse">
                <option value="Python FullStack">Python FullStack</option>
                <option value="Java FullStack">Java FullStack</option>
                <option value="Data Science & AI">Data Science & AI</option>
            </select><br><br>
            <button type="submit" class="btn">Register</button>
            <p style="margin-top: 1rem;">Already have an account? <a href="login.html">Login here</a></p>
        </form>
    </main>
    <script src="js/static/script.js"></script>
</body>

</html>
